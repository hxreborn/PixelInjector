language: en-US
reviews:
  profile: chill
  poem: false
  high_level_summary: true
  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!.kotlin/**"
    - "!**/package-lock.json"
    - "!CHANGELOG.md"
    - "!app/src/main/assets/shade_icons.tsv"
    - "!app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/theme/Color.kt"
    - "!gradle/wrapper/gradle-wrapper.jar"
  path_instructions:
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/xposed/**/*.kt"
      instructions: |
        Each tweak is one hook file with one switch. Members resolve into an immutable bindings object first. A miss logs `target not found tweak= member= build= reason=` and returns false, never throws into the host.
        Interceptors read one @Volatile flag and always reach chain.proceed(); the documented exceptions are ScreenshotSound, KdeConnectQuiet, DialerDechip (`NotificationManager#notify` for a `phone_feedback` channel notification), HideAppShortcuts (`loadAppShortcuts`), FirefoxClassicMenu (`MenuBottomSheetHandle`, `LibraryMenuGroup` which emits `MenuItem` rows instead, `Badge` on the Desktop site row which emits a `Checkbox` instead, and `Text` for the account description) and HomeMenuEntry (`Resources#getValue` and `Resources#getDrawable` for its reserved icon id, `Resources#getText` for its reserved label id). Flag reflection, DexKit, disk I/O, Binder calls or resource-name lookups inside an interceptor, and any Chain captured for deferred or async work (a Chain is single-use and single-thread). The documented exceptions are ChargingDetails (the sticky battery intent and `BATTERY_PROPERTY_CURRENT_NOW` per `computePowerIndication` or battery `updateIndication` call, which run on battery and keyguard updates), FingerprintIcon (one icon decode per style change, cached for every view), DownloadChip (two resource id lookups when the status bar view inflates, `getActiveNotifications` replayed on the main looper on a toggle or when the tracked download ends, `hasPinnedHeadsUp` per heads-up change and the `mIconStates` and `mNotification` field reads in `calculateIconXTranslations` while a download is shown), HomeMenuEntry (the icon render once per process on the first menu open, since install has no Context) and FirefoxMaterialYou (`Application#onCreate` reads the system colors and registers or removes its `FabricatedOverlay` through `OverlayManager` once per process start; a toggle does the same from the `Switch` onLoad on the main looper, adds or removes the `ResourcesLoader` on the app and every live activity and calls `recreate()` on each; `AcornTheme` writes the `ColorScheme` fields by reflection on each call and builds the recolored `AcornGradientScheme` once per stock scheme) and FirefoxLoadingIndicator (the `SwipeRefreshLayout` constructor adds every layout to a weak set and writes three resolved int fields and reads two resolved fields once per layout, `CircleImageView#setBackgroundColor` writes the resolved `mBackgroundColor` of an applied layout, and a toggle applies or reverts every tracked layout from the `Switch` onLoad on the main looper) and PillShot (the screenshot entry, capture and Samsung captured result hooks read the app label through PackageManager before drawing the pill) and HideShortcutCircles (the Compose shortcut content lambda reads its view model through `State#getValue`, resolves the `wallpaperTextColorAccent` attr id once per process and reads that color through `obtainStyledAttributes` on each shortcut composition) and FirefoxClassicMenu (each menu open reads the toolbar position through `Settings`, configures the sheet and its `BottomSheetBehavior` through resolved members, and each menu row reads `LocalColorScheme` through `Composer#consume`; `MenuGroup` emits a `HorizontalDivider` through the composer it is called with).
        Flag catch (Throwable) or runCatching around hook(...) or class lookup: HookFailedError extends Error and must propagate. Resolution failures are caught as Exception or LinkageError, through `resolving` in util/Reflect.kt. getMethod returns the inherited declaration, so use getDeclaredMethod or gate on chain.thisObject?.javaClass.
        Flag repeated hook and unhook of one target, which leaks JNI global refs. Hot paths hook once on first enable and never unhook.
        Nothing in install may need a Context, because onPackageReady runs before the Application exists. Hook-side remote prefs are read-only, so a hook never calls edit(). Values carried by saveState across hot reload must be platform types, since the old generation's Kotlin classes are not the new generation's.
        xposed/ must not import ui/, Compose or libsu.
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/xposed/Tweaks.kt"
      instructions: |
        Every tweak descriptor needs a matching TweakUi entry with the same key in ui/dashboard/TweakUi.kt. The key is the `tweak=` value in every log line.
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/prefs/**/*.kt"
      instructions: |
        Each key and default is defined once in Prefs.kt and read through its spec, never respelled at a read site. Never write emptySet() to a remote pref: Kotlin's EmptySet throws BadParcelableException on the next read, so write null to clear.
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/**/*.kt"
      instructions: |
        ui/ must not import xposed/. Dimensions are Material 3 tokens first and a named file-private Dp second, never a shared dimens object. Animations use MaterialTheme.motionScheme, except a continuous linear rotation or a looping linear progress preview, which have no motion scheme spec. List rows go through the card Tile in ui/component/Tile.kt. Scaffolds take only the top and horizontal safeDrawing insets.
    - path: "app/src/main/res/values/strings.xml"
      instructions: |
        UI copy is a plain verb plus the real thing it changes. No commas in UI strings. Framework constants appear verbatim in mono. Never use "LSPosed" as the generic framework name.
    - path: "app/src/main/resources/META-INF/xposed/**"
      instructions: |
        scope.list must list every target package a hook file installs into. Keep system_server and SystemUI in scope only for tweaks that need them. module.prop keeps min and target at 102.
    - path: "**/*.kt"
      instructions: |
        No code comments. Flag any added comment, except a license header on code adapted from another project and the one line naming the app and build above a new resolution branch, such as `// Pixel Launcher 17 CP2A.260605.012`. Line limit is 100 columns, 140 under ui/, with trailing commas (ktlint_official).
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
