language: en-US
reviews:
  profile: chill
  poem: false
  high_level_summary: true
  path_filters:
    - "!**/build/**"
    - "!.gradle/**"
    - "!.kotlin/**"
    - "!**/package-lock.json"
    - "!CHANGELOG.md"
    - "!app/src/main/assets/shade_icons.tsv"
    - "!app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/theme/Color.kt"
    - "!gradle/wrapper/gradle-wrapper.jar"
  path_instructions:
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/xposed/**/*.kt"
      instructions: |
        Each tweak is one hook file with one switch. Members resolve into an immutable bindings object first. A miss logs `target not found tweak= member= build= reason=` and returns false, never throws into the host.
        Interceptors read one @Volatile flag and always reach chain.proceed(); the documented exceptions are ScreenshotSound (on HMD Crest Max the merged Runnable reads its resolved class id and skips only the shutter branch), KdeConnectQuiet, DialerDechip (`NotificationManager#notify` for a `phone_feedback` channel notification), HideAppShortcuts (`loadAppShortcuts`), FirefoxClassicMenu (`MenuBottomSheetHandle`, `LibraryMenuGroup` which emits `MenuItem` rows instead, `Badge` on the Desktop site row which emits a `Checkbox` instead, and `Text` for the account description) and HomeMenuEntry (`Resources#getValue` and `Resources#getDrawable` for its reserved icon id, `Resources#getText` for its reserved label id) and CrtScreenOff (`ColorFade#prepare` when CRT preparation succeeds, `ColorFade#draw` while it owns a CRT surface, `DisplayPowerController#animateScreenStateChange` while an AOD start grant is pending or a granted transition owns the display and `animateScreenBrightness` while either holds awake brightness. A 200 ms timeout resumes the stock transition if the grant is missing). Flag reflection, DexKit, disk I/O, Binder calls or resource-name lookups inside an interceptor, and any Chain captured for deferred or async work (a Chain is single-use and single-thread). The documented exceptions are FirefoxBetterfox (`GeckoRuntime#init` backs up or restores the browser's own profile files before Gecko starts, and suppresses injection if preparation fails), ChargingDetails (the sticky battery intent and `BATTERY_PROPERTY_CURRENT_NOW` per `computePowerIndication`, the Google controller's resolved `mLockScreenIndicationView` read after each `computePowerIndication` to apply or restore the stock line limit, also while the tweak is off, battery `updateIndication` or Samsung battery `addIndication` and `addIndicationTimeout` calls, which run on battery and keyguard updates), FingerprintIcon (one icon decode per style change, cached for every view), NowPlayingChip (status bar inflation posts view construction and shared placement resource lookups to the main looper, media session Binder calls and app icon loading run on its owned worker thread, and hot reload unregisters callbacks and joins that worker), DownloadChip (two resource id lookups when the status bar view inflates, `getActiveNotifications` replayed on the main looper on a toggle or when the tracked download ends, `hasPinnedHeadsUp` per heads-up change and the `mIconStates` and `mNotification` field reads in `calculateIconXTranslations` while a download is shown), HomeMenuEntry (the icon render once per process on the first menu open, since install has no Context) and FirefoxMaterialYou (`Application#onCreate` reads the system colors and registers or removes its `FabricatedOverlay` through `OverlayManager` once per process start; a toggle does the same from the `Switch` onLoad on the main looper, adds or removes the `ResourcesLoader` on the app and every live activity and calls `recreate()` on each; `AcornTheme` writes the `ColorScheme` fields by reflection on each call and builds the recolored `AcornGradientScheme` once per stock scheme) and FirefoxLoadingIndicator (the `SwipeRefreshLayout` constructor adds every layout to a weak set and writes three resolved int fields and reads two resolved fields once per layout, `CircleImageView#setBackgroundColor` writes the resolved `mBackgroundColor` of an applied layout, and a toggle applies or reverts every tracked layout from the `Switch` onLoad on the main looper) and PillShot (the standard, Motorola, HMD and Transsion screenshot entry, capture and Samsung captured result hooks read the receiver's resolved screenshot service, controller and Context fields once per screenshot and the app label through PackageManager before drawing the pill) and HideShortcutCircles (the Samsung shortcut draw reads its task state and target view flags and caches its two Paint fields per view, temporarily zeroes their alpha and restores both in a finally block, and the Compose shortcut content lambda reads its view model through `State#getValue`, resolves the `wallpaperTextColorAccent` attr id once per process and reads that color through `obtainStyledAttributes` on each shortcut composition) and FirefoxClassicMenu (each menu open reads the toolbar position through `Settings`, configures the sheet and its `BottomSheetBehavior` through resolved members, and each menu row reads `LocalColorScheme` through `Composer#consume`. The configurable popup reads the fragment configuration for the width and the section ID for library rows. `MenuGroup` emits a `HorizontalDivider` through the composer it is called with) and CrtScreenOff (`DisplayStateController#updateDisplayState` reads resolved display, policy and doze-state fields and tracks the latest default-display awake result even with the switch off. With the switch on it returns that result while the default display awaits a doze state and writes the resolved `mPerformScreenOffTransition` only for an explicit doze OFF with no forced display blank. It calls the resolved proximity flag getter to distinguish a forced blank; `ColorFade#prepare` skips `proceed()` when it builds the CRT surface, which reads `DisplayInfo` through `DisplayManagerInternal`, builds a container and eight colour layers through hidden `SurfaceControl` builder and transaction methods, writes the resolved ColorFade surface fields, disposes the display transaction listener if setup fails, and sets the duration and interpolator of `mColorFadeOffAnimator` from the controller looked up under `DisplayManagerService#mSyncRoot`. The CRT surface retains that animator and its previous timing. Stock prepare dismisses any owned CRT surface before `proceed()`. `ColorFade#draw` and `ColorFade#dismiss` follow CRT surface ownership across switch toggles. Draw reads the resolved `mSurfaceControl`, `mPrepared` and `mTransaction` fields, sets layer alpha and crop, and updates ColorFade's resolved `mSurfaceVisible` and `mSurfaceAlpha` fields. On failure it covers the CRT frame with black and ends the off animator. Stock draw runs only for surfaces outside CRT ownership. Dismiss cancels the off animator before `proceed()`, then restores its duration and interpolator and releases the owned layers in `finally`. Direct `ColorFade#destroy` releases the layers after stock teardown on the destroy executor; in SystemUI the Transsion merged handler reads its captured ScreenLifecycle to distinguish keyguard messages from unrelated callbacks. The keyguard lifecycle handler arms the hold at sleep onset, clears it before wake, and replays the stock scrim amounts with the display off. On the main looper, the armed `LightRevealScrim#setRevealAmount` checks the shade window type and reads the default display state and `PowerManager#isInteractive`. It reads the registered `DozeParameters` from SystemUI's dump registry and calls `getAlwaysOn()` before holding the reveal open. If the registered instance is missing or its members did not resolve, it uses a worker-maintained `Settings.Secure` `doze_always_on` value and fails open until that value is available. A request passed through unchanged discards an older held amount for that scrim; DisplayPowerController#animateScreenStateChange may defer the default-display AOD transition while the CRT and reveal acknowledgements run, and animateScreenBrightness holds the awake brightness or sets a zero ramp under the black frame. The display controller and SystemUI coordinate through an authenticated companion provider on worker threads, with bounded fallback and frame-commit acknowledgement).
        Flag catch (Throwable) or runCatching around hook(...) or class lookup: HookFailedError extends Error and must propagate. Resolution failures are caught as Exception or LinkageError, through `resolving` in util/Reflect.kt. getMethod returns the inherited declaration, so use getDeclaredMethod or gate on chain.thisObject?.javaClass.
        Flag repeated hook and unhook of one target, which leaks JNI global refs. Hot paths hook once on first enable. Preference toggles reuse the registered hooks. CrtScreenOff registers its awake-state tracking at install and its ColorFade and SystemUI reveal hooks on first enable. Hot reload waits for CRT hook registration, surface ownership and reveal work to finish within a bounded deadline, then stops the connection worker before swapping generations. The old generation stops arming holds after accepting reload. The new generation restores the shared awake-state map before installing the display hook.
        Nothing in install may need a Context, because onPackageReady runs before the Application exists. Hook-side remote prefs are read-only, so a hook never calls edit(). Values carried by saveState across hot reload must be platform types, since the old generation's Kotlin classes are not the new generation's.
        CrtScreenOff may also skip DisplayPowerState#prepareColorFade inside the stock off transition after preparing the CRT surface and scheduling the draw. Its SystemUI reveal collector uses the same hold and replay rules as the scrim setter.
        EmptyShade reads the localized empty message and formats the zero-Modes message after the text-only collector emits.
        xposed/ must not import ui/, Compose or libsu.
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/xposed/Tweaks.kt"
      instructions: |
        Every tweak descriptor needs a matching TweakUi entry with the same key in ui/dashboard/TweakUi.kt. The key is the `tweak=` value in every log line.
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/prefs/**/*.kt"
      instructions: |
        Each key and default is defined once in Prefs.kt and read through its spec, never respelled at a read site. Never write emptySet() to a remote pref: Kotlin's EmptySet throws BadParcelableException on the next read, so write null to clear.
    - path: "app/src/main/kotlin/eu/hxreborn/pixelinjector/ui/**/*.kt"
      instructions: |
        ui/ must not import xposed/. Dimensions are Material 3 tokens first and a named file-private Dp second, never a shared dimens object. Animations use MaterialTheme.motionScheme, except a continuous linear rotation or a looping linear progress preview, which have no motion scheme spec. List rows go through the card Tile in ui/component/Tile.kt. Scaffolds take only the top and horizontal safeDrawing insets.
    - path: "app/src/main/res/values/strings.xml"
      instructions: |
        UI copy is a plain verb plus the real thing it changes. No commas in UI strings. Framework constants appear verbatim in mono. Never use "LSPosed" as the generic framework name.
    - path: "app/src/main/resources/META-INF/xposed/**"
      instructions: |
        scope.list must list every target package a hook file installs into. Keep system_server and SystemUI in scope only for tweaks that need them. module.prop keeps min and target at 102.
    - path: "**/*.kt"
      instructions: |
        No code comments. Flag any added comment, except a license header on code adapted from another project and the one line naming the app and build above a new resolution branch, such as `// Pixel Launcher 17 CP2A.260605.012`. Line limit is 100 columns, 140 under ui/, with trailing commas (ktlint_official).
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames:
      - "dependabot[bot]"
